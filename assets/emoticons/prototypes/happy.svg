<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
<title id="title">Happy — reinterpretare fidelă a emoticonului Yahoo! Messenger</title>
<defs>
  <radialGradient id="face" cx="43%" cy="36%" r="66%">
    <stop stop-color="#fff79a"/><stop offset=".55" stop-color="#ffdc57"/>
    <stop offset=".86" stop-color="#f8bb43"/><stop offset="1" stop-color="#d99a31"/>
  </radialGradient>
  <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#fbe46e"/><stop offset="1" stop-color="#c98429"/></linearGradient>
</defs>
<!-- Silueta puțin turtită și mai sus, ca GIF-ul de 18×18, nu un emoji circular generic. -->
<path d="M48 6C27 6 12 17 10 37C7 53 13 69 26 77C37 84 59 84 71 77C85 68 90 50 86 35C83 17 68 6 48 6Z" fill="url(#rim)"/>
<path d="M48 9C29 9 16 20 14 38C11 53 17 66 29 74C40 80 57 81 68 74C81 66 86 51 83 37C80 20 66 9 48 9Z" fill="url(#face)"/>
<path d="M25 21Q44 9 66 20" fill="none" stroke="#fff5b6" stroke-width="4" stroke-linecap="round" opacity=".72"/>
<path d="M20 42Q23 51 20 58" fill="none" stroke="#ed9c37" stroke-width="3" opacity=".45"/>
<path d="M76 44Q79 53 75 60" fill="none" stroke="#d98d2e" stroke-width="3" opacity=".38"/>
<ellipse cx="25" cy="53" rx="7" ry="5" fill="#ec8250" opacity=".44"/>
<ellipse cx="72" cy="53" rx="7" ry="5" fill="#e9863b" opacity=".4"/>
<!-- Ochii mici, albaștri, cu clipitul în cele patru cadre la ritmul GIF-ului: 7.5/.1/.5/.1 s. -->
<g style="transform-origin:48px 36px">
  <rect x="32" y="30" width="6" height="13" rx="1.3" fill="#303a8a"/>
  <rect x="56" y="30" width="6" height="13" rx="1.3" fill="#303a8a"/>
  <path d="M33 32V37M57 32V37" stroke="#7c90dc" stroke-width="1.5" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="scale" calcMode="discrete" values="1 1;1 .08;1 1;1 .08;1 1" keyTimes="0;.914634;.926829;.987805;1" dur="8.2s" repeatCount="indefinite"/>
</g>
<path d="M30 37h9m17 0h9" fill="none" stroke="#fff5cb" stroke-width="3" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" calcMode="discrete" values="0;1;0;1;0" keyTimes="0;.914634;.926829;.987805;1" dur="8.2s" repeatCount="indefinite"/>
</path>
<!-- Zâmbetul subțire, închis, cu reflexul albicios al originalului. -->
<path d="M28 56Q46 73 69 55" fill="none" stroke="#aa6125" stroke-width="7" stroke-linecap="round"/>
<path d="M32 55Q47 66 65 55" fill="none" stroke="#fbe6a5" stroke-width="3" stroke-linecap="round"/>
<path d="M36 68Q48 74 60 68" fill="none" stroke="#e39e43" stroke-width="3" opacity=".55"/>
</svg>
